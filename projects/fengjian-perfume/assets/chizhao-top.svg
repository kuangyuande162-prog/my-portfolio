<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850"><rect width="1200" height="850" fill="#f6f5ee"/><text x="50" y="45" fill="#777c70" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">FENGJIAN / HOME FRAGRANCE / H01</text><text x="50" y="96" fill="#242925" font-family="Arial,sans-serif" font-size="32" >The lid and vessel share one circular footprint.</text><text x="50" y="125" fill="#777c70" font-family="Arial,sans-serif" font-size="11" >TOP VIEW / ONE COTTON WICK / LID REMOVED BEFORE LIGHTING</text><path d="M50 150H1150M50 785H1150" stroke="#bbc1b2"/><circle cx="300" cy="430" r="192" fill="#d4cec3" stroke="#242925" stroke-width="2"/><circle cx="300" cy="430" r="164" fill="#ece9db" stroke="#afa994"/><circle cx="300" cy="430" r="8" fill="#cfccbc"/><path d="M300 430V413" stroke="#4d463b" stroke-width="3" stroke-linecap="round"/><circle cx="880" cy="430" r="196" fill="#493b30" stroke="#242925" stroke-width="2"/><g transform="translate(828 378) scale(1.6)" opacity=".8"><g fill="none" stroke="#b8a58e" stroke-width="3" stroke-linecap="square"><path d="M28 10H10V54H28M38 10H54V54H38M30 22V42M36 22V42"/></g></g><text x="300" y="695" fill="#777c70" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">D 96 / INNER D 82 / COTTON WICK</text><text x="880" y="695" fill="#777c70" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">D 98 / T 7 / RECESSED INNER SHOULDER D 80</text><text x="300" y="737" fill="#777c70" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">UNLIT WAX / RECESSED BELOW RIM</text><text x="880" y="737" fill="#777c70" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">WOOD GRAIN, NOT A METAL OR CERAMIC CAP</text><text x="50" y="816" fill="#777c70" font-family="Arial,sans-serif" font-size="10" >EXTERIOR CONCEPT ONLY. FIT, FIRED CERAMIC TOLERANCES, WAX WEIGHT AND BURN PERFORMANCE REQUIRE SAMPLING.</text></svg>